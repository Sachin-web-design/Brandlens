<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrandLens</title>
<style>
:root{--bg:#fff;--fg:#2c2c2a;--mut:#5f5e5a;--card:#f5f5f2;--bd:#d3d1c7;--g:#0f6e56;--gl:#e1f5ee;--hi:#fbd5d5;--me:#ffe9b3;--lo:#dbe7ff;--ok:#d4f0df}
@media(prefers-color-scheme:dark){:root{--bg:#1b1b19;--fg:#ececea;--mut:#a8a69e;--card:#262624;--bd:#3d3d3a;--g:#5dcaa5;--gl:#0f3d30;--hi:#6b2323;--me:#6b5110;--lo:#23396b;--ok:#17492c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd)}
h1{margin:0;font-size:22px;color:var(--g)}header .sp{flex:1}.banner{background:var(--gl);padding:8px 16px;font-size:13px}
nav{display:flex;gap:6px;padding:10px 16px;flex-wrap:wrap}nav button.on{background:var(--g);color:var(--bg);border-color:var(--g)}
main{max-width:980px;margin:0 auto;padding:0 16px 40px}section{display:none}section.on{display:block}
button,select,input,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.p{background:var(--g);color:var(--bg);border-color:var(--g);font-weight:600}
textarea{width:100%;min-height:110px}input.w{width:100%}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:8px 0}
.pill{font-size:12px;padding:1px 8px;border-radius:99px;margin-right:6px}.high{background:var(--hi)}.medium{background:var(--me)}.low{background:var(--lo)}.info{background:var(--ok)}
mark{color:inherit;border-radius:3px;padding:0 2px}.mut{color:var(--mut);font-size:13px}.src{font-size:13px;border-left:3px solid var(--g);padding-left:8px;margin:4px 0}
.bar{height:10px;background:var(--g);border-radius:5px}.hl{white-space:pre-wrap;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px}
table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--bd);padding:4px 8px;text-align:left;font-size:13px}.err{color:#c0392b}.sw{display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid var(--bd);vertical-align:middle;margin-right:4px}.warn{background:var(--me);border-radius:8px;padding:6px 10px;font-size:13px;margin:6px 0}.ok{color:var(--g)}ul.n{margin:4px 0 4px 18px;padding:0;font-size:13px}
</style></head><body>
<header><h1>BrandLens</h1><span class="mut" id="brand"></span><span class="sp"></span>
<label>Viewing as <select id="role"><option value="creator">Creator</option><option value="reviewer">Reviewer</option><option value="manager">Manager</option></select></label></header>
<div class="banner">Demo mode: no login needed. Switch the role above. AI only suggests; a human always makes the final decision.</div>
<nav id="tabs"><button data-t="new" class="on">1. Review content</button><button data-t="queue">2. Review queue</button><button data-t="insights">3. Insights</button><button data-t="bench">Benchmark</button><button data-t="kb">Brand knowledge</button></nav>
<main>
<section id="new" class="on">
 <div class="row"><input class="w" id="title" placeholder="Title, e.g. Diwali launch post"><select id="channel"><option>Instagram post</option><option>Website</option><option>Email</option><option>Influencer post</option></select><select id="sample"><option value="">Load a sample...</option></select></div>
 <textarea id="text" placeholder="Paste your content here, or upload an image, DOCX or PDF below"></textarea>
 <div class="row"><label>Upload a file: <input type="file" id="file" accept=".png,.jpg,.jpeg,.webp,.gif,.docx,.pdf"></label><button id="rmfile" style="display:none">Remove file</button><span class="mut">Or try a sample file:</span><button class="sf" data-f="ok_post.png">On-brand image</button><button class="sf" data-f="bad_post.png">Off-brand image</button><button class="sf" data-f="launch_brief.docx">DOCX brief</button><button class="sf" data-f="campus_flyer.pdf">PDF flyer</button></div>
 <div id="fileinfo"></div>
 <div class="row"><label><input type="checkbox" id="img"> Image attached</label><input class="w" id="alt" placeholder="Alt text for the image" style="flex:1"><label class="mut"><input type="checkbox" id="useai" checked> AI-assisted check</label><button class="p" id="run">Run review</button></div>
 <div id="res"></div>
</section>
<section id="queue"></section><section id="insights"></section><section id="bench"></section><section id="kb"></section>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={findings:[],decisions:{},fixes:[],open:null,brand:null,upload:null};
const REASONS=['Not applicable here','Guideline is unclear','Approved exception','Verified elsewhere'];
async function api(p,b,form){const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),90000);let r;
 try{r=await fetch(p,form?{method:'POST',body:form,signal:ac.signal}:b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b),signal:ac.signal}:{signal:ac.signal})}
 catch(e){throw new Error('Could not reach the server. On free hosting it can take up to a minute to wake up, so please wait a moment and try again.')}
 finally{clearTimeout(tm)}
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(typeof j.detail==='string'?j.detail:'Request failed ('+r.status+')');return j}
const role=()=>$('#role').value;
function tab(t){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===t));if(t==='queue')loadQueue();if(t==='insights')loadInsights();if(t==='bench')loadBench();if(t==='kb')loadKb()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
$('#role').onchange=()=>{const t=document.querySelector('section.on').id;if(t==='queue')loadQueue()};
function hl(text,fs){const sp=fs.filter(f=>f.start!=null&&f.status==='issue').sort((a,b)=>a.start-b.start);let o='',p=0;for(const f of sp){if(f.start<p)continue;o+=esc(text.slice(p,f.start))+`<mark class="${f.severity}" title="${esc(f.rule_id)}">${esc(text.slice(f.start,f.end))}</mark>`;p=f.end}return o+esc(text.slice(p))}
function pending(){return S.findings.filter(f=>['high','medium'].includes(f.severity)&&f.status==='issue'&&!S.decisions[f.id])}
async function run(){const text=$('#text').value;if(!text.trim()&&!S.upload){$('#res').innerHTML='<p class="err">Please paste some content or upload a file first.</p>';return}
 $('#res').innerHTML='<p class="mut">Reviewing... (the free server can take up to a minute to wake up the first time)</p>';$('#run').disabled=true;
 try{const r=await api('/api/review',{text,channel:$('#channel').value,has_image:$('#img').checked,alt_text:$('#alt').value,use_ai:$('#useai').checked,upload_id:S.upload||''});S.findings=r.findings;S.ai=r.ai;
 const ids=new Set(r.findings.map(f=>f.id));for(const k in S.decisions)if(!ids.has(k))delete S.decisions[k];draw(r.counts)}
 catch(e){$('#res').innerHTML=`<p class="err">${esc(e.message)}</p>`}finally{$('#run').disabled=false}}
function card(f,i){const d=S.decisions[f.id],s=f.suggestion;let a='';
 if(f.status==='supported')return `<div class="card"><span class="pill info">supported</span><b>${esc(f.text)}</b><div class="src">${esc(f.why)} ${esc(f.source)}</div></div>`;
 if(s&&s.type==='replace')a+=`<button onclick="fix(${i})">Apply fix: ${esc(s.with)}</button> `;
 if(s&&s.type==='append')a+=`<button onclick="fix(${i})">Apply fix: add${esc(s.text)}</button> `;
 if(s&&s.type==='remove_sentence')a+=`<div class="mut">Suggestion: ${esc(s.text)}</div><button onclick="fix(${i})">Remove sentence</button> `;
 if(s&&s.type==='note')a+=`<div class="mut">Suggestion: ${esc(s.text)}</div>`;
 a+=d?`<div class="mut">Dismissed: ${esc(d.reason)} <button onclick="undo(${i})">Undo</button></div>`:`<select id="r${i}">${REASONS.map(x=>`<option>${x}</option>`).join('')}</select> <button onclick="dis(${i})">Dismiss</button>`;
 return `<div class="card"><span class="pill ${f.severity}">${f.severity}</span><span class="pill info">${esc(f.category)}</span>${f.origin==='ai'?'<span class="pill info">AI</span>':''}${f.origin==='file'?'<span class="pill info">from file</span>':''}${f.verdict==='cannot_verify'?'<span class="pill medium">cannot verify</span>':''}${f.tuned?'<span class="pill medium">severity tuned by Manager</span>':''}<b>${esc(f.text||'(whole post)')}</b> <span class="mut">confidence: ${esc(f.confidence)}</span><div>${esc(f.why)}</div><div class="src">${esc(f.rule_id)}: ${esc(f.source)}</div>${f.origin==='ai'?`<div class="mut">Evidence cited: ${esc(f.cited_source_id||'none (cannot verify)')}. Approved passages retrieved: ${esc((f.retrieved||[]).join(', '))}</div>`:''}${a}</div>`}
function draw(c){const p=pending().length;$('#res').innerHTML=`<h3>Findings <span class="mut">${c.high} high, ${c.medium} medium, ${c.low} low</span></h3>${tools()}<div class="mut">${esc(S.ai?S.ai.status:'')}</div><div class="hl">${hl($('#text').value,S.findings)}</div>${S.findings.length?S.findings.map(card).join(''):'<div class="card">No issues found.</div>'}
 <div class="card"><b>Next:</b> ${p?`<span class="err">The Submit button is locked until ${p} high or medium finding(s) are fixed or dismissed with a reason.</span><ul class="n">${pending().map(f=>`<li>${esc(f.severity)}: ${esc(f.rule_id)} ${esc(f.text||'(whole post)')}</li>`).join('')}</ul><div class="mut">Use Apply fix, Fix all suggested, or choose a reason and press Dismiss on each card above.</div>`:'<span class="ok">Ready to send for human review.</span>'}<div class="row"><button class="p" ${p?'disabled':''} onclick="submitIt()">Submit for human review</button></div><div id="msg"></div></div>`}
function applyAll(text,fs){const rm=[],ed=[];for(const f of fs){const s=f.suggestion;if(f.status!=='issue'||!s)continue;
 if(s.type==='remove_sentence')rm.push([s.start,s.end]);else if(s.type==='replace'&&f.start!=null)ed.push([f.start,f.end,s.with])}
 rm.sort((a,b)=>a[0]-b[0]);const m=[];for(const r of rm){const l=m[m.length-1];if(l&&r[0]<l[1])l[1]=Math.max(l[1],r[1]);else m.push(r.slice())}
 const all=m.map(r=>[r[0],r[1],'']).concat(ed.filter(e=>!m.some(r=>e[0]>=r[0]&&e[1]<=r[1])));
 all.sort((a,b)=>b[0]-a[0]);let t=text,n=0,last=Infinity;for(const [a,b,rep] of all){if(b>last)continue;t=t.slice(0,a)+rep+t.slice(b);last=a;n++}
 for(const f of fs){if(f.status==='issue'&&f.suggestion&&f.suggestion.type==='append'&&!t.includes(f.suggestion.text.trim())){t=t.trimEnd()+f.suggestion.text;n++}}
 return {text:t.replace(/[ \t]{2,}/g,' ').trim(),n}}
//END applyAll
function tools(){const n=applyAll($('#text').value,S.findings).n;return `<div class="row">${n?`<button class="p" onclick="fixAll()">Fix all suggested (${n})</button>`:''}${S.prev!=null?'<button onclick="undoAll()">Undo last Fix all</button>':''}<span class="mut">Fixes are applied to your text only. Review the result before you submit.</span></div>`}
async function fixAll(){const r=applyAll($('#text').value,S.findings);if(!r.n)return;S.prev=$('#text').value;S.prevFixes=S.fixes.length;
 S.findings.forEach(f=>{const s=f.suggestion;if(f.status==='issue'&&s&&['replace','append','remove_sentence'].includes(s.type))S.fixes.push({rule_id:f.rule_id,before:f.text,after:'auto'})});
 $('#text').value=r.text;await run()}
function undoAll(){if(S.prev==null)return;$('#text').value=S.prev;S.fixes.length=S.prevFixes;S.prev=null;run()}
function counts(){const c={high:0,medium:0,low:0};S.findings.forEach(f=>{if(c[f.severity]!==undefined&&f.status==='issue')c[f.severity]++});return c}
async function fix(i){const f=S.findings[i],s=f.suggestion;let t=$('#text').value,after;
 if(s.type==='replace'){after=s.with;t=t.slice(0,f.start)+s.with+t.slice(f.end)}else if(s.type==='remove_sentence'){after='';t=t.slice(0,s.start)+t.slice(s.end)}else{after=s.text;t=t.trimEnd()+s.text}
 t=t.replace(/[ \t]{2,}/g,' ').trim();
 S.fixes.push({rule_id:f.rule_id,before:f.text,after});$('#text').value=t;await run()}
function dis(i){const f=S.findings[i];S.decisions[f.id]={action:'dismissed',reason:$('#r'+i).value};draw(counts())}
function undo(i){delete S.decisions[S.findings[i].id];draw(counts())}
async function submitIt(){if(!$('#title').value.trim()){$('#msg').innerHTML='<p class="err">Please add a title in the box at the top first.</p>';$('#title').focus();return}
 if(!$('#text').value.trim()){$('#msg').innerHTML='<p class="err">Add the post text or caption before submitting.</p>';return}
 try{$('#msg').innerHTML='<p class="mut">Submitting...</p>';const s=await api('/api/submissions',{title:$('#title').value,author:'Demo creator',text:$('#text').value,channel:$('#channel').value,has_image:$('#img').checked,alt_text:$('#alt').value,upload_id:S.upload||'',decisions:S.decisions,applied_fixes:S.fixes});
 S.decisions={};S.fixes=[];S.open=s.id;clearFile();tab('queue')}catch(e){$('#msg').innerHTML=`<p class="err">${esc(e.message)}</p>`}}
async function loadQueue(){const items=await api('/api/submissions');const el=$('#queue');
 let h='<h3>Review queue</h3>'+items.map(s=>`<div class="card"><b>${esc(s.title)}</b> <span class="pill ${s.status==='Approved'?'info':s.status==='In review'?'medium':'high'}">${esc(s.status)}</span> <span class="mut">${esc(s.author)}, ${esc(s.channel)}</span> <button onclick="openSub('${s.id}')">Open</button></div>`).join('');
 const s=items.find(x=>x.id===S.open);if(s)h+=detail(s);el.innerHTML=h}
function openSub(id){S.open=id;loadQueue()}
function detail(s){const can=role()!=='creator'&&s.status==='In review';
 const fs=s.findings.filter(f=>f.status==='issue').map(f=>`<tr><td>${f.severity}</td><td>${esc(f.rule_id)}</td><td>${esc(f.text)}</td><td>${f.decision?'Dismissed: '+esc(f.decision.reason):'Open'}</td></tr>`).join('');
 return `<div class="card" style="border-color:var(--g)"><h3>${esc(s.title)} <span class="mut">${esc(s.id)}</span></h3><div class="hl">${esc(s.text)}</div>
 <p class="mut">Creator applied ${s.applied_fixes.length} suggested fix(es).</p>${fs?`<table><tr><th>Severity</th><th>Rule</th><th>Text</th><th>Creator decision</th></tr>${fs}</table>`:'<p class="mut">No open issues.</p>'}
 <h4>History</h4>${s.history.map(h=>`<div class="mut">${esc(h.at.slice(0,16).replace('T',' '))} | ${esc(h.who)} | ${esc(h.action)} ${esc(h.comment)}</div>`).join('')}
 <h4>Comments</h4>${s.comments.map(c=>`<div class="mut">${esc(c.who)}: ${esc(c.text)}</div>`).join('')||'<div class="mut">None yet.</div>'}
 <div class="row"><input class="w" id="cm" placeholder="Add a comment" style="flex:1"><button onclick="comment('${s.id}')">Comment</button></div>
 ${can?`<h4>Your decision (${role()})</h4><textarea id="dc" placeholder="Comment (required when requesting changes)"></textarea><div class="row"><button class="p" onclick="decide('${s.id}','approve')">Approve</button><button onclick="decide('${s.id}','request_changes')">Request changes</button></div>`:`<p class="mut">${s.status==='In review'?'Switch to Reviewer or Manager (top right) to decide.':'Decision recorded.'}</p>`}<div id="dm"></div></div>`}
async function decide(id,a){try{await api(`/api/submissions/${id}/decision`,{role:role(),action:a,comment:$('#dc').value});loadQueue()}catch(e){$('#dm').innerHTML=`<p class="err">${esc(e.message)}</p>`}}
async function comment(id){const t=$('#cm').value;if(!t.trim())return;await api(`/api/submissions/${id}/comments`,{role:role(),text:t});loadQueue()}
async function loadInsights(){const d=await api('/api/insights');const cl=await clarityHtml();const mx=Math.max(1,...Object.values(d.by_category));
 const rows=o=>Object.entries(o).map(([k,v])=>`<div class="row"><span style="width:120px">${esc(k)}</span><div class="bar" style="width:${Math.round(v/mx*260)+10}px"></div> ${v}</div>`).join('')||'<div class="mut">No data yet.</div>';
 $('#insights').innerHTML=`<h3>Governance insights</h3><div class="card"><b>${d.total}</b> submissions: ${Object.entries(d.statuses).map(([k,v])=>esc(k)+' '+v).join(', ')}. Suggested fixes applied: ${d.fixes_applied}.</div>
 <div class="card"><h4>Issues by category</h4>${rows(d.by_category)}</div><div class="card"><h4>Most frequent rules</h4>${d.top_rules.map(r=>`<div>${esc(r[0])}: ${r[1]}</div>`).join('')||'<div class="mut">No data yet.</div>'}</div>
 <div class="card"><h4>Most dismissed rules</h4><div class="mut">Rules creators often dismiss may be unclear or too strict.</div>${d.dismissed_rules.map(r=>`<div>${esc(r[0])}: dismissed ${r[1]} time(s)</div>`).join('')||'<div class="mut">No dismissals yet.</div>'}</div>`+cl}
async function clarityHtml(){const d=await api('/api/clarity');const mgr=role()==='manager';
 const rows=d.rules.map(r=>`<div class="card"><b>${esc(r.rule_id)}</b> <span class="pill ${r.severity}">${esc(r.severity)}</span><span class="pill info">${esc(r.category)}</span>${r.tuned?'<span class="pill medium">tuned</span>':''}
 <div class="src">${esc(r.source)}</div><div class="mut">Flagged ${r.flagged}x, dismissed ${r.dismissed} (${Math.round(r.dismissal_rate*100)}%), fixes applied ${r.fixes_applied}. Reasons: ${esc(Object.entries(r.reasons).map(([k,v])=>k+' '+v).join(', ')||'none')}</div>
 <div><b>${esc(r.diagnosis_label)}</b></div><div>${esc(r.suggestion)}</div>${r.proposal&&!r.tuned?`<div class="mut">Proposed change: ${esc(r.proposal.text)}</div>`:''}
 ${r.wording?`<div class="src">Approved wording: ${esc(r.wording)}</div>`:''}<div class="src" id="w_${esc(r.rule_id)}" style="display:none"></div>
 <div class="row">${mgr?`${r.proposal&&!r.tuned?`<button class="p" onclick="tune('${esc(r.rule_id)}','lower_severity')">Approve proposed change</button>`:''}${r.tuned?`<button onclick="tune('${esc(r.rule_id)}','revert')">Revert</button>`:''}<button onclick="wordIt('${esc(r.rule_id)}')">Suggest clearer wording</button><button onclick="tune('${esc(r.rule_id)}','accept_wording')">Accept wording</button>`:'<span class="mut">Only a Manager can approve changes. Switch the role at the top.</span>'}</div></div>`).join('');
 return `<h3>Guideline clarity and learning loop</h3><p class="mut">Built from review history (includes seeded demo history). Nothing changes until a Manager approves. Compliance rules (facts, disclosure) are never tuned.</p>`+(rows||'<div class="card mut">Not enough review history yet.</div>')}
async function tune(rule,action){try{const w=$('#w_'+rule);await api('/api/clarity/apply',{role:role(),rule_id:rule,action,text:action==='accept_wording'&&w?w.textContent:''});loadInsights()}catch(e){alert(e.message)}}
async function wordIt(rule){try{const r=await api('/api/clarity/suggest',{role:role(),rule_id:rule,action:'suggest'});const w=$('#w_'+rule);w.style.display='block';w.textContent=r.text;w.title=r.from_ai?'Suggested by AI':'Template suggestion'}catch(e){alert(e.message)}}
async function loadKb(){const b=await api('/api/brand');S.brand=b;$('#kb').innerHTML=`<h3>Brand knowledge base</h3><p class="mut">${esc(b.name)}. Tone: ${esc(b.tone)}</p>
 <div class="card"><h4>Approved facts</h4><table><tr><th>ID</th><th>Fact</th><th>Owner</th><th>Valid until</th></tr>${b.facts.map(f=>`<tr><td>${f.id}</td><td>${esc(f.text)}</td><td>${esc(f.owner)}</td><td>${esc(f.valid_until||'no expiry')}</td></tr>`).join('')}</table></div>
 <div class="card"><h4>Terminology</h4>${b.terms.map(t=>`<div>${esc(t.rule)}: avoid ${esc(t.avoid.join(', '))}, use <b>${esc(t.use)}</b></div>`).join('')}</div>
 <div class="card"><h4>Claim rules</h4>${b.claims.map(c=>`<div>${esc(c.rule)}: ${esc(c.source)}</div>`).join('')}</div>
 ${(b.clarified||[]).length?`<div class="card"><h4>Clarified guidelines (approved by a Manager)</h4>${b.clarified.map(c=>`<div>${esc(c.rule_id)}: ${esc(c.text)}</div>`).join('')}</div>`:''}
 <div class="card"><h4>Approved claims</h4>${b.approved_claims.map(c=>`<div>${esc(c.id)}: ${esc(c.text)} (evidence: ${esc(c.evidence)})</div>`).join('')}</div>
 <div class="card"><h4>Visual rules</h4><div>${b.visual.palette.map(c=>`<span class="sw" style="background:${esc(c)}" title="${esc(c)}"></span>`).join('')}</div><div class="mut">${esc(b.visual.source_palette)}</div><div class="mut">${esc(b.visual.source_logo)}</div><div class="mut">${esc(b.visual.source_contrast)}</div><img src="/assets/logo.png" alt="Nourish Daily demo logo" width="64"></div>`}
function clearFile(){S.upload=null;$('#file').value='';$('#rmfile').style.display='none';$('#fileinfo').innerHTML=''}
$('#rmfile').onclick=()=>{clearFile();S.findings=[];S.decisions={};$('#res').innerHTML=''};
async function sendFile(file){if(!file)return;const fd=new FormData();fd.append('file',file);$('#fileinfo').innerHTML='<p class="mut">Reading '+esc(file.name)+'...</p>';
 try{const r=await api('/api/upload',null,fd);S.upload=r.upload_id;S.decisions={};S.fixes=[];S.prev=null;
  if(r.text)$('#text').value=r.text;$('#img').checked=r.kind==='image';if(!$('#title').value.trim())$('#title').value=r.filename;$('#rmfile').style.display='';
  $('#fileinfo').innerHTML=`<div class="card"><b>${esc(r.filename)}</b> <span class="pill info">${esc(r.kind)}</span> ${r.kind!=='image'&&r.text?`<span class="mut">${r.text.length} characters of text extracted</span>`:''}<ul class="n">${r.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`;
  await run()}catch(e){clearFile();$('#fileinfo').innerHTML=`<p class="err">${esc(e.message)}</p>`}}
$('#file').onchange=e=>sendFile(e.target.files[0]);
document.querySelectorAll('.sf').forEach(b=>b.onclick=async()=>{try{const r=await fetch('/samples/'+b.dataset.f);if(!r.ok)throw new Error('Sample file not found');await sendFile(new File([await r.blob()],b.dataset.f))}catch(e){$('#fileinfo').innerHTML=`<p class="err">${esc(e.message)}</p>`}});
async function loadBench(){const el=$('#bench');el.innerHTML='<p class="mut">Running the benchmark...</p>';
 try{const d=await api('/api/benchmark');const r=d.rules,a=d.ai;
 const cat=Object.entries(r.by_category).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.caught} of ${v.total}</td><td>${v.pct}%</td></tr>`).join('');
 const aiHtml=a.run===false?`<div class="mut">${esc(a.note)}</div>`:`<table><tr><th>Measure</th><th>Result</th></tr><tr><td>Items run</td><td>${a.items_run} (errors: ${a.errors})</td></tr><tr><td>AI caught, paraphrased or Hinglish issues</td><td>${a.ai_caught_of_ai_targeted} of ${a.ai_targeted_issues} (${a.ai_recall_pct}%)</td></tr><tr><td>Combined recall (rules + AI)</td><td>${a.combined_recall_pct}%</td></tr><tr><td>Clean posts with an AI finding</td><td>${a.clean_items_with_ai_finding} (${a.ai_false_alarm_pct}%)</td></tr><tr><td>AI findings citing a valid retrieved source</td><td>${a.with_valid_source_pct}%</td></tr><tr><td>AI findings marked cannot verify</td><td>${a.cannot_verify_pct}%</td></tr><tr><td>Answers rejected by the validator</td><td>${a.rejected_by_validator}</td></tr></table><div class="mut">Measured ${esc(a.run_at||'')}. ${esc(a.status||'')}</div>`;
 el.innerHTML=`<h3>Benchmark: ${r.items} sample posts</h3><p class="mut">Fictional brand Nourish Daily: ${r.clean_items} clean posts and ${r.planted_issues} planted issues, written by the team. The rule-targeted posts were written to match the rules, so a high score there is not independent proof. The rule results below were computed live on this server just now.</p>
 <div class="card"><h4>Rule layer (no AI)</h4><table><tr><th>Measure</th><th>Result</th></tr><tr><td>Planted issues caught (all)</td><td>${r.caught} of ${r.planted_issues} (${r.recall_pct}%)</td></tr><tr><td>Rule-targeted issues caught</td><td>${r.recall_rule_targeted_pct}%</td></tr><tr><td>Paraphrased or Hinglish issues caught</td><td>${r.recall_ai_targeted_pct}% (a known weak spot; the AI layer is for these)</td></tr><tr><td>False alarms on clean posts (high or medium)</td><td>${r.false_alarm_items_high_medium} of ${r.clean_items} (${r.false_alarm_rate_pct}%)</td></tr><tr><td>Findings with a rule ID and source quote</td><td>${r.with_valid_citation_pct}%</td></tr><tr><td>Findings marked cannot verify</td><td>${r.cannot_verify_pct}%</td></tr></table></div>
 <div class="card"><h4>By category</h4><table><tr><th>Category</th><th>Caught</th><th>%</th></tr>${cat}</table></div>
 <div class="card"><h4>AI layer (Gemini with retrieval and a strict validator)</h4>${aiHtml}</div>
 <div class="card"><h4>Weak spots: issues the rules missed</h4>${r.missed.map(m=>`<div class="mut">${esc(m.id)} (${esc(m.category)}): ${esc(m.text)}</div>`).join('')||'None'}</div>`}
 catch(e){el.innerHTML=`<p class="err">${esc(e.message)}</p>`}}
$('#run').onclick=()=>run().catch(e=>{$('#res').innerHTML=`<p class="err">${esc(e.message)}</p>`});
